---
- name: Refuse to lock ourselves out
  ansible.builtin.assert:
    that:
      - baseline_admin_users | length > 0
    fail_msg: "Define at least one entry in baseline_admin_users before hardening SSH."

- name: Install hardened sshd drop-in
  ansible.builtin.template:
    src: 10-baseline.conf.j2
    dest: /etc/ssh/sshd_config.d/10-baseline.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Ensure sshd is enabled
  ansible.builtin.service:
    name: ssh
    enabled: true
