---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

# SSH is opened first so enabling the firewall can never cut the session.
- name: Allow SSH (rate limited)
  community.general.ufw:
    rule: limit
    port: "{{ baseline_ssh_port | string }}"
    proto: tcp
    comment: ssh

- name: Allow extra TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ baseline_firewall_allowed_tcp }}"

- name: Allow extra UDP ports
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: udp
  loop: "{{ baseline_firewall_allowed_udp }}"

- name: Allow trusted networks
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
  loop: "{{ baseline_firewall_trusted_cidrs }}"

- name: Default deny incoming, allow outgoing, enable
  community.general.ufw:
    state: enabled
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
    logging: "low"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }
